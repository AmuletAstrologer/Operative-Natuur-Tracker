<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
    <title>Operative Natuur Tracker</title>
  </head>
  <body>
    <div class="app-frame">
      <header class="hero">
        <!-- Modal moet hierop komen. -->
        <div class="help-button" aria-label="Help">
          <span id="myBtn">?</span>
        </div>


        <!-- The Modal -->
        <div id="myModal" class="modal">
          <!-- Modal content -->
          <div class="modal-content">
            <span class="close">&times;</span>
            <p>Some text in the Modal..</p>
          </div>
        </div>

        <div class="search-box" role="search">
          <input
            type="search"
            id="mySearch"
            name="q"
            placeholder="Search..."
            aria-label="Search through site content"
          />
          <button type="button" aria-label="Search">
            <i class="fa fa-search"></i>
          </button>
        </div>
      </header>

      <!-- ALGEMEEN: De echte route moet later van de database komen. -->
      <!-- Status, moet of groen, rood of grijs zijn om te laten zien of de gebruiker hem kan kiezen. -->
      <main class="dashboard">
        <section class="routes" aria-label="Recent routes">
          <a href="./Navigation.html" style="text-decoration: none"
            ><article
              class="route-item"
              style="background-image: url(./images/R1.jpeg)"
            >
              <div class="route-row">
                <span class="route-number">#1</span>
                <span class="route-name">Nirvana Route</span>
                <span class="route-status" aria-label="Route status"></span>
              </div>
              <p>
                Ongeveer: <strong>35 Minuten</strong> Niveau: <em>Makkelijk</em>
              </p>
            </article></a
          >

          <a href="./Navigation.html" style="text-decoration: none"
            ><article
              class="route-item"
              style="background-image: url(./images/R2.png)"
            >
              <div class="route-row">
                <span class="route-number">#2</span>
                <span class="route-name">Valken Route</span>
                <span class="route-status" aria-label="Route status"></span>
              </div>
              <p>
                Ongeveer: <strong>55 Minuten</strong> Niveau:
                <em style="color: orange">Middelmatig</em>
              </p>
            </article></a
          >

          <a href="./Navigation.html" style="text-decoration: none"
            ><article
              class="route-item"
              style="background-image: url(./images/R3.png)"
            >
              <div class="route-row">
                <span class="route-number">#3</span>
                <span class="route-name">Eiken Route</span>
                <span class="route-status" aria-label="Route status"></span>
              </div>
              <p>
                Ongeveer: <strong>145 Minuten</strong> Niveau:
                <em style="color: red">Moeilijk</em>
              </p>
            </article>
          </a>
        </section>

        <button type="button" class="more-routes">Bekijk meer routes...</button>

        <div class="quick-actions" aria-label="Quick actions">
          <button type="button" class="action-btn" aria-label="Go back">
            <i class="fa fa-undo"></i>
          </button>
          <button type="button" class="action-btn" aria-label="Route marker">
            <i class="fa fa-map-signs"></i>
          </button>
          <button type="button" class="action-btn" aria-label="Weather">
            <i class="fa fa-cloud"></i>
          </button>
          <button type="button" class="action-btn sos" aria-label="SOS call">
            <img src="./images/SOS.png" style="height: 60px; width: 80px" />
          </button>
        </div>

        <button type="button" class="primary-btn warning-btn">
          <span>Melding Maken</span>
          <span class="button-icon">
            <i class="fa fa-comment"></i>
          </span>
        </button>

        <button type="button" class="primary-btn success-btn">
          <span>Connectie met Drone</span>
          <span class="button-icon">
            <i class="fa fa-link"></i>
          </span>
        </button>
      </main>
    </div>
    <script src="./javascript/modal.js"></script>
  </body>
</html>
